# meta-webos-kvm: makes the webOS OSE qemux86-64 image work out of the box on QEMU/KVM
# (virtio-gpu + virgl, IDE disk). See ../README.md.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "webos-kvm"
BBFILE_PATTERN_webos-kvm = "^${LAYERDIR}/"
BBFILE_PRIORITY_webos-kvm = "20"

# Accept whatever release series the checked-out build-webos uses.
LAYERSERIES_COMPAT_webos-kvm = "kirkstone mickledore nanbield scarthgap styhead walnascar whinlatter"
